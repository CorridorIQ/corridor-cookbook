<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__OWNER__'s HQ</title>
<!--
  Personal HQ board template (personal-hq skill).
  The skill fills four double-underscore tokens and nothing else:
    OWNER  first name, for the title and greeting
    LAYOUT desk | columns | day | list
    STYLE  clearwater | morning-light | briefing | graphite
    AREAS  JSON array of the owner's areas, in the script tag with id "hq-areas"
  Everything else comes from the artifact db (todos, drafts, prompts, meta/*), see SPEC.md.
  Open the file with #demo (or anywhere the db is unavailable) to see invented sample data.
-->
<script>
  // Stamp layout, style and theme on the root before first paint so nothing flashes.
  // A viewer's own choice (settings menu) lives in localStorage and wins only while the
  // board's defaults are unchanged; when Claude changes the defaults, the new ones apply.
  (function () {
    var root = document.documentElement;
    var L = "__LAYOUT__", S = "__STYLE__";
    if (L.indexOf("__") === 0) L = "desk";
    if (S.indexOf("__") === 0) S = "clearwater";
    var p = null;
    try { p = JSON.parse(localStorage.getItem("hq.prefs") || "null"); } catch (e) {}
    if (p && p.base === L + "/" + S) { L = p.layout || L; S = p.style || S; }
    if (p && p.theme && p.theme !== "system") root.setAttribute("data-theme", p.theme);
    root.setAttribute("data-layout", L);
    root.setAttribute("data-style", S);
  })();
</script>
<script type="application/json" id="hq-areas">__AREAS__</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* ============================================================
   Tokens. Four presets share one token vocabulary so the board CSS
   never branches on style. Hex values come from design/DESIGN-BAR.md
   section 6; no color appears outside these blocks except rgba() of
   --shadow-rgb, which is the preset's ink.
   ============================================================ */
:root {
  color-scheme: light;
  --page: #f6fafc; --surface: #ffffff; --raised: #ffffff; --chip: #eaf4f9;
  --ink: #123049; --muted: #4a6d81; --accent: #0b7db8; --accent-hover: #0a70a5; --on-accent: #ffffff;
  --soft: #77c9db; --border: #dceaf2; --line-strong: #c2dae7; --hover: #eef6fa; --track: #e6eff5;
  --ok: #17703f; --ok-tint: #e6f4ec; --warn: #8f5a17; --warn-dot: #b4762a; --warn-tint: #f5ead9;
  --shadow-rgb: 18, 48, 73;
  --font-ui: 'Familjen Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-display: var(--font-ui);
  --font-mono: 'Spline Sans Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --display-weight: 600; --display-track: -0.022em;
  --r-card: 10px; --r-control: 8px; --r-window: 14px;
  --ease: cubic-bezier(.23, 1, .32, 1);
  --ease-io: cubic-bezier(.77, 0, .175, 1);
  --ease-breathe: cubic-bezier(.6, 0, .4, 1);
  --ease-fade: cubic-bezier(.45, 0, .55, 1);
}
:root[data-style="morning-light"] {
  --page: #f7fafc; --chip: #eef6fb; --soft: #bfe4f2; --border: #dbe8f0; --line-strong: #cfe3ef; --hover: #eef6fb;
  --font-ui: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --display-weight: 500; --display-track: -0.034em;
  --r-card: 16px; --r-control: 999px; --r-window: 22px;
}
:root[data-style="briefing"] {
  --accent: #053d5b; --accent-hover: #0a4f74;
  --font-ui: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-display: 'Source Serif 4', Georgia, serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --display-track: -0.012em; --r-card: 6px; --r-control: 6px; --r-window: 8px; --track: var(--chip);
}
:root[data-style="graphite"] {
  --page: #f1f2f3; --chip: #f2f2f3; --ink: #1f2124; --muted: #62656b; --accent: #0a6fd6; --accent-hover: #085fb8;
  --soft: #e9f3ff; --border: #ecedef; --line-strong: #e0e2e5; --hover: #f2f2f3; --track: #ecedef;
  --shadow-rgb: 31, 33, 36;
  --font-ui: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --display-track: -0.02em; --r-card: 8px; --r-control: 6px; --r-window: 10px;
}
/* Dark tokens: written twice on purpose. Once for "system" (media query, unless the viewer
   forced light) and once for a forced data-theme="dark". Keep the two copies identical. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0a2032; --surface: #0c2537; --raised: #11304a; --chip: #143a57;
    --ink: #e6f0f6; --muted: #a9c8d8; --accent: #3fa3d8; --accent-hover: #5ab3e2; --on-accent: #0a2032;
    --soft: #77c9db; --border: #1d3b52; --line-strong: #2a4d66; --hover: #11304a; --track: #0c2537;
    --ok: #5cc08a; --ok-tint: rgba(92, 192, 138, .14); --warn: #e2b26a; --warn-dot: #e2b26a; --warn-tint: rgba(226, 178, 106, .14);
    --shadow-rgb: 4, 16, 26;
  }
  :root:not([data-theme="light"])[data-style="morning-light"] { --ink: #f2f8fb; --muted: #9dbdd0; --accent: #77c9db; --accent-hover: #9ad0e9; --soft: #4d9cc4; }
  :root:not([data-theme="light"])[data-style="briefing"] {
    --page: #0e1a22; --surface: #13232d; --raised: #1b3140; --chip: #1b3140; --ink: #e8eef2; --muted: #9fb2bf;
    --accent: #77c9db; --accent-hover: #9adbe8; --on-accent: #13232d; --soft: #3f7f93; --border: #22394a; --line-strong: #2e4a5e; --hover: #1b3140; --track: #13232d;
  }
  :root:not([data-theme="light"])[data-style="graphite"] {
    --page: #111214; --surface: #17181b; --raised: #222428; --chip: #222428; --ink: #ededee; --muted: #a0a3a8;
    --accent: #4c9dff; --accent-hover: #6eb0ff; --on-accent: #111214; --soft: #1b2a3d; --border: #26282c; --line-strong: #33363b; --hover: #222428; --track: #17181b;
    --shadow-rgb: 0, 0, 0;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0a2032; --surface: #0c2537; --raised: #11304a; --chip: #143a57;
  --ink: #e6f0f6; --muted: #a9c8d8; --accent: #3fa3d8; --accent-hover: #5ab3e2; --on-accent: #0a2032;
  --soft: #77c9db; --border: #1d3b52; --line-strong: #2a4d66; --hover: #11304a; --track: #0c2537;
  --ok: #5cc08a; --ok-tint: rgba(92, 192, 138, .14); --warn: #e2b26a; --warn-dot: #e2b26a; --warn-tint: rgba(226, 178, 106, .14);
  --shadow-rgb: 4, 16, 26;
}
:root[data-theme="dark"][data-style="morning-light"] { --ink: #f2f8fb; --muted: #9dbdd0; --accent: #77c9db; --accent-hover: #9ad0e9; --soft: #4d9cc4; }
:root[data-theme="dark"][data-style="briefing"] {
  --page: #0e1a22; --surface: #13232d; --raised: #1b3140; --chip: #1b3140; --ink: #e8eef2; --muted: #9fb2bf;
  --accent: #77c9db; --accent-hover: #9adbe8; --on-accent: #13232d; --soft: #3f7f93; --border: #22394a; --line-strong: #2e4a5e; --hover: #1b3140; --track: #13232d;
}
:root[data-theme="dark"][data-style="graphite"] {
  --page: #111214; --surface: #17181b; --raised: #222428; --chip: #222428; --ink: #ededee; --muted: #a0a3a8;
  --accent: #4c9dff; --accent-hover: #6eb0ff; --on-accent: #111214; --soft: #1b2a3d; --border: #26282c; --line-strong: #33363b; --hover: #222428; --track: #17181b;
  --shadow-rgb: 0, 0, 0;
}
:root {
  --shadow-card: 0 0 0 1px var(--border), 0 1px 2px rgba(var(--shadow-rgb), .05), 0 2px 6px rgba(var(--shadow-rgb), .04);
  --shadow-card-hover: 0 0 0 1px color-mix(in srgb, var(--accent) 32%, var(--border)), 0 1px 2px rgba(var(--shadow-rgb), .05), 0 14px 32px -20px rgba(var(--shadow-rgb), .38);
  --shadow-btn: 0 0 0 1px var(--line-strong), 0 1px 2px rgba(var(--shadow-rgb), .06);
  --shadow-lift: 0 0 0 1px var(--border), 0 24px 56px -36px rgba(var(--shadow-rgb), .42);
  --shadow-cta: 0 6px 22px -6px color-mix(in srgb, var(--accent) 50%, transparent);
  --shadow-cta-hover: 0 12px 30px -8px color-mix(in srgb, var(--accent) 55%, transparent);
}
/* Briefing draws rules, not shadows. */
:root[data-style="briefing"] { --shadow-card: 0 0 0 1px var(--border); --shadow-card-hover: 0 0 0 1px color-mix(in srgb, var(--accent) 40%, var(--border)); }

/* During a style or theme swap only, every color crossfades over 240ms. Transitions are
   not left on permanently: that would make every hover and re-render pay for them. */
:root.is-restyling *, :root.is-restyling *::before, :root.is-restyling *::after {
  transition: background-color 240ms var(--ease-fade), color 240ms var(--ease-fade), border-color 240ms var(--ease-fade), box-shadow 240ms var(--ease-fade), outline-color 240ms var(--ease-fade) !important;
}

/* ============================================================ Base */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; background: var(--page); }
body {
  margin: 0; min-height: 100vh; background: var(--page); color: var(--ink);
  font: 400 15px/1.5 var(--font-ui); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
::selection { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
a { color: var(--accent); text-underline-offset: 3px; text-decoration-color: color-mix(in srgb, var(--accent) 40%, transparent); }
h1, h2, h3, p { margin: 0; }
h1, h2 { text-wrap: balance; }
p { text-wrap: pretty; }
.num { font-variant-numeric: tabular-nums; }
.icon { width: 16px; height: 16px; flex: none; display: block; }
.icon-sm { width: 12px; height: 12px; flex: none; display: block; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* Morning Light's one decorative element: a soft glow top right, the website hero atmosphere. */
:root[data-style="morning-light"] body::before {
  content: ""; position: fixed; z-index: 0; pointer-events: none; top: -30vh; right: -20vw; width: 80vw; height: 90vh;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--accent-hover) 22%, transparent), transparent);
}

.app { position: relative; z-index: 1; max-width: 1376px; margin: 0 auto; padding: 32px 32px 64px; }

/* Mono is a labeling texture: eyebrows, chips, counts, dates. Never sentences. */
.eyebrow { font: 500 11px/1.4 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.chip {
  display: inline-flex; align-items: center; gap: 6px; max-width: 100%; min-height: 22px; padding: 3px 9px; border-radius: 999px;
  background: var(--chip); color: var(--muted); font: 500 11px/1.3 var(--font-mono); letter-spacing: .04em; text-transform: uppercase;
  white-space: nowrap; text-decoration: none;
}
.chip > .t { overflow: hidden; text-overflow: ellipsis; }
.chip .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.chip-accent { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-strong); }
.chip-accent .dot { background: var(--accent); }
.chip-warn { background: var(--warn-tint); color: var(--warn); }
.chip-warn .dot { background: var(--warn-dot); }
.chip-ok { background: var(--ok-tint); color: var(--ok); }

/* ============================================================ Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 16px;
  border: 0; border-radius: var(--r-control); background: var(--surface); color: var(--ink); box-shadow: var(--shadow-btn);
  font: 500 14px/1 var(--font-ui); text-decoration: none; white-space: nowrap;
  transition: transform 200ms var(--ease), box-shadow 200ms var(--ease), background-color 200ms var(--ease), color 200ms var(--ease);
}
.btn:hover { background: var(--hover); }
.btn:active { transform: scale(.97); transition-duration: 100ms; }
.btn-primary { background: var(--accent); color: var(--on-accent); box-shadow: var(--shadow-cta); }
.btn-primary:hover { background: var(--accent-hover); transform: translateY(-2px); box-shadow: var(--shadow-cta-hover); }
.btn-primary:active { transform: scale(.97); }
.btn-quiet { background: transparent; box-shadow: none; color: var(--muted); padding: 0 12px; }
.btn-quiet:hover { background: var(--hover); color: var(--ink); }
.btn[aria-disabled="true"] { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1px var(--border); cursor: not-allowed; transform: none; }
.btn .arrow { transition: transform 200ms var(--ease); }
.btn:hover .arrow { transform: translate(1px, -1px); }

/* Segmented control: tabs, layout and theme switches. Track plus a raised active thumb. */
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: calc(var(--r-control) + 3px); background: var(--track); box-shadow: inset 0 0 0 1px var(--border); }
:root[data-style="morning-light"] .seg { border-radius: 999px; }
.seg button {
  display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border: 0; border-radius: var(--r-control);
  background: transparent; color: var(--muted); font: 500 14px/1 var(--font-ui);
  transition: background-color 160ms var(--ease), color 160ms var(--ease), box-shadow 160ms var(--ease), transform 100ms var(--ease);
}
.seg button:hover { color: var(--ink); }
.seg button:active { transform: scale(.97); }
.seg button[aria-selected="true"], .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(var(--shadow-rgb), .12), 0 0 0 1px var(--border); }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--on-accent); box-shadow: none; }
.tabs .count { font: 500 11px/1 var(--font-mono); opacity: .8; font-variant-numeric: tabular-nums; }

/* ============================================================ Header */
.top { position: relative; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 40px; }
.top-right { display: flex; align-items: center; gap: 8px; }
.hero { padding: 24px 0 32px; animation: fade-in 400ms var(--ease) both; }
.greeting {
  font: var(--display-weight) clamp(30px, 3.4vw, 44px)/1.08 var(--font-display); letter-spacing: var(--display-track);
  margin-top: 12px;
}
.focus { margin-top: 12px; max-width: 64ch; font-size: clamp(17px, 1.5vw, 20px); line-height: 1.45; color: var(--ink); }
.hero-row { display: grid; grid-template-columns: auto 1fr; gap: 48px; align-items: end; margin-top: 32px; }
.stats { display: flex; gap: 40px; }
.stat .n { display: block; font: 400 44px/1 var(--font-display); letter-spacing: -0.026em; font-variant-numeric: tabular-nums; }
:root[data-style="briefing"] .stat .n { font-family: var(--font-ui); font-weight: 400; }
.stat .eyebrow { display: block; margin-top: 8px; }
.fresh { justify-self: end; text-align: right; display: grid; gap: 8px; justify-items: end; }
.fresh p { font-size: 13px; color: var(--muted); }
.sweeping { display: inline-flex; align-items: center; gap: 8px; }
.sources { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; align-items: center; }
.sources .eyebrow { margin-right: 4px; }

/* ============================================================ Toolbar */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-bottom: 24px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
.bar-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.nudge { display: flex; align-items: baseline; gap: 10px; margin: -8px 0 24px; font-size: 14px; color: var(--muted); }
.nudge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--warn-dot); flex: none; transform: translateY(-2px); }
.nudge button { border: 0; background: none; padding: 0; color: var(--ink); text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
.nudge button:hover { text-decoration-color: var(--accent); }

/* ============================================================ Cards
   Fixed anatomy (rule 7): title, one muted context line, a chip row with the
   due date right-aligned. Nothing else lives on the face; detail opens on tap. */
.stack { display: grid; gap: 8px; align-content: start; }
.card {
  position: relative; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 12px; padding: 14px 16px 14px 14px;
  background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow-card); cursor: pointer;
  transform-origin: 50% 100%;
  transition: box-shadow 240ms var(--ease), transform 100ms var(--ease), opacity 200ms var(--ease-fade);
}
.card:hover { box-shadow: var(--shadow-card-hover); }
.card:active { transform: scale(.97); }
.card:has(.check:active), .card:has(.src:active) { transform: none; }
.card-title { font-size: 15px; font-weight: 600; line-height: 1.35; letter-spacing: -0.005em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-wrap: pretty; }
.card-title span {
  background: linear-gradient(var(--soft), var(--soft)) no-repeat 0 58% / 0% 1.5px; -webkit-box-decoration-break: clone; box-decoration-break: clone;
  transition: background-size 260ms var(--ease-io), color 260ms var(--ease);
}
.card-ctx { margin-top: 2px; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; min-width: 0; }
.card-foot .due { margin-left: auto; padding-left: 8px; font: 500 11px/1 var(--font-mono); letter-spacing: .04em; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.src { flex: 0 1 auto; min-width: 0; position: relative; transition: background-color 200ms var(--ease), color 200ms var(--ease); }
a.src:hover { background: var(--hover); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-strong); }
/* Medium confidence: the card reads as tentative, not as a different kind of thing. */
.card[data-conf="medium"] { box-shadow: 0 1px 2px rgba(var(--shadow-rgb), .04); outline: 1px dashed var(--line-strong); outline-offset: -1px; }
.card[data-conf="medium"]:hover { outline-color: color-mix(in srgb, var(--accent) 45%, var(--line-strong)); }
.card[data-conf="medium"] .card-title { font-weight: 500; }
/* Suspicious: calm amber ring and a Review chip. Never red, never an alarm. */
.card[data-sus] { box-shadow: 0 0 0 1px color-mix(in srgb, var(--warn-dot) 50%, var(--border)), 0 1px 2px rgba(var(--shadow-rgb), .05); }
.card.is-done .card-title { font-weight: 500; color: var(--muted); }
.card.is-done .card-title span, .card.is-completing .card-title span { background-size: 100% 1.5px; }
.card.is-completing .card-title span { color: var(--muted); }

/* The check: fills accent, then a 1.8px tick draws itself on the io curve. */
.check {
  position: relative; width: 22px; height: 22px; margin-top: 0; padding: 0; border: 0; border-radius: 6px;
  background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--line-strong); color: var(--on-accent);
  transition: background-color 200ms var(--ease), box-shadow 200ms var(--ease), transform 100ms var(--ease);
}
:root[data-style="morning-light"] .check { border-radius: 50%; }
.check::before { content: ""; position: absolute; inset: -9px; }
.check:hover { box-shadow: inset 0 0 0 1.5px var(--accent); }
.check:active { transform: scale(.9); }
.check svg { position: absolute; inset: 3px; width: 16px; height: 16px; }
.check path { stroke-dasharray: 22; stroke-dashoffset: 22; transition: stroke-dashoffset 240ms var(--ease-io) 60ms; }
.is-done .check, .is-completing .check { background: var(--accent); box-shadow: none; }
.is-done .check path, .is-completing .check path { stroke-dashoffset: 0; }

/* The "now" card: the single most urgent thing. Accent ring, and on fine pointers the
   website's cursor-lit border (a 190px glow masked down to a 1.5px band). One card only. */
.card.is-now { box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 55%, var(--border)), 0 24px 56px -36px rgba(var(--shadow-rgb), .42); }
@media (hover: hover) and (pointer: fine) {
  .card.is-now::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; pointer-events: none; opacity: 0;
    background: radial-gradient(190px circle at var(--mx, 50%) var(--my, 50%), color-mix(in srgb, var(--accent) 55%, transparent), color-mix(in srgb, var(--soft) 18%, transparent) 55%, transparent 80%);
    -webkit-mask: linear-gradient(var(--ink) 0 0) content-box, linear-gradient(var(--ink) 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
    transition: opacity 300ms var(--ease);
  }
  .card.is-now:hover::after { opacity: 1; }
  /* Source chip tooltip: exact origin after 300ms; once one has shown, the rest show at once. */
  .src[data-tip]::after {
    content: attr(data-tip); position: absolute; left: 0; bottom: calc(100% + 8px); z-index: 5; max-width: 340px; width: max-content;
    padding: 6px 10px; border-radius: 6px; background: var(--raised); color: var(--ink); box-shadow: var(--shadow-lift);
    font: 500 11px/1.4 var(--font-mono); letter-spacing: .04em; white-space: normal; pointer-events: none;
    opacity: 0; transform: translateY(3px); transition: opacity 160ms var(--ease-fade), transform 160ms var(--ease);
  }
  .src[data-tip]:hover::after { opacity: 1; transform: none; transition: opacity 240ms var(--ease) 300ms, transform 300ms var(--ease) 300ms; }
  .tips-warm .src[data-tip]:hover::after { transition-delay: 0ms; }
}

/* Cards land one by one: rise 5px from .97 (chips-lab cascade), 70ms stagger. Only first
   render and newly arrived cards animate; a re-render never replays it. */
@keyframes rise { from { opacity: 0; transform: translateY(5px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
.is-new { animation: rise 460ms var(--ease) both; animation-delay: calc(var(--i, 0) * 70ms); }

/* ============================================================ Layout: desk (areas) */
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 0 2px 12px; }
.section-head h2 { font: 600 15px/1.3 var(--font-display); letter-spacing: -0.01em; }
:root[data-style="briefing"] .section-head h2 { font-size: 17px; }
.desk { display: grid; grid-template-columns: repeat(auto-fill, minmax(288px, 1fr)); gap: 32px 24px; align-items: start; }
.desk > section { min-width: 0; }
.drop-on { border-radius: var(--r-card); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent); background: color-mix(in srgb, var(--accent) 4%, transparent); }

/* ============================================================ Layout: columns (status) */
.cols { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: stretch; }
.cols > section { min-width: 0; padding: 0 16px; border-left: 1px solid var(--border); min-height: 240px; }
.cols > section:first-child { padding-left: 0; border-left: 0; }
.cols > section:last-child { padding-right: 0; }
.cols .card { cursor: grab; }

/* ============================================================ Layout: day (vertical spine) */
.day { max-width: 760px; }
.day > section { position: relative; padding: 0 0 32px 32px; }
.day > section::before {
  content: ""; position: absolute; left: 6px; top: 18px; bottom: 0; width: 2px;
  background: radial-gradient(circle, var(--soft) 1px, transparent 1.4px) 0 0 / 2px 7px repeat-y;
}
.day > section:last-child::before { display: none; }
.day .node { position: absolute; left: 1px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--page); box-shadow: inset 0 0 0 2px var(--line-strong); }
.day > section:first-child .node { box-shadow: inset 0 0 0 2px var(--accent); }
.day > section:first-child .node::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--accent); }

/* ============================================================ Layout: list (one calm column) */
.list { max-width: 720px; }
.top3 { display: grid; gap: 12px; margin-bottom: 40px; }
.top3 .rankrow { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 8px; align-items: start; }
.top3 .rank { font: 400 32px/1 var(--font-display); letter-spacing: -0.026em; color: var(--muted); padding-top: 10px; font-variant-numeric: tabular-nums; }
.list > section { margin-bottom: 32px; }

/* Empty: the orb, still, plus one mono line. */
.empty { display: flex; align-items: center; gap: 10px; padding: 16px 2px; }
.empty-hero { flex-direction: column; justify-content: center; text-align: center; gap: 16px; padding: 64px 16px; }
.orb { color: var(--muted); }
.orb.live { color: var(--accent); }

/* Collapsed extras: done this week, recently deleted. */
.extras { margin-top: 40px; display: grid; gap: 8px; max-width: 760px; }
details.fold { border-top: 1px solid var(--border); padding-top: 4px; }
details.fold > summary { list-style: none; display: flex; align-items: center; gap: 8px; min-height: 40px; cursor: pointer; border-radius: var(--r-control); }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary .icon { color: var(--muted); transition: transform 240ms var(--ease); transform: rotate(-90deg); }
details.fold[open] > summary .icon { transform: none; }
.rows { display: grid; gap: 0; padding: 4px 0 8px; }
.row { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 4px 2px; border-bottom: 1px solid var(--border); font-size: 14px; }
.row:last-child { border-bottom: 0; }
.row .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .muted { color: var(--muted); }

/* ============================================================ Drafts: each reads like an email */
.narrow { max-width: 760px; }
.help { font-size: 14px; color: var(--muted); margin-bottom: 8px; }
.voice-nudge { display: flex; gap: 10px; align-items: center; padding: 12px 16px; margin: 16px 0 24px; border-radius: var(--r-card); background: var(--surface); box-shadow: var(--shadow-card); font-size: 14px; }
.voice-nudge .icon { color: var(--accent); }
.letters { display: grid; gap: 24px; }
.letter { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow-card); overflow: hidden; }
.letter.is-new { animation-name: rise; }
.letter-head { display: grid; gap: 0; padding: 4px 20px; border-bottom: 1px solid var(--border); }
.lrow { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; align-items: baseline; gap: 12px; min-height: 40px; padding: 10px 0; font-size: 14px; }
.lrow + .lrow { border-top: 1px solid var(--border); }
.lrow .addr { color: var(--muted); }
.lrow .subj { font-weight: 600; }
.letter-body {
  display: block; width: 100%; min-height: 120px; padding: 20px; border: 0; resize: none; background: transparent; color: var(--ink);
  font: 400 15px/1.6 var(--font-ui); field-sizing: content; outline: none;
  transition: background-color 200ms var(--ease);
}
.letter-body:hover { background: color-mix(in srgb, var(--hover) 50%, transparent); }
.letter-body:focus { background: var(--hover); }
.letter-body:focus-visible { outline: none; box-shadow: inset 3px 0 0 var(--accent); }
.letter-why { padding: 0 20px 16px; font-size: 13px; color: var(--muted); }
.letter-actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 16px 20px; border-top: 1px solid var(--border); background: var(--page); }
.letter-actions .btn:last-child { margin-left: auto; }
.letter.is-stale .letter-body { color: var(--muted); }
.letter.is-leaving, .card.is-leaving { animation: none; overflow: hidden; transition: height 200ms var(--ease-fade), opacity 160ms var(--ease-fade), margin 200ms var(--ease-fade), padding 200ms var(--ease-fade); }

/* ============================================================ Prompts */
.prompts { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.prompt { display: grid; gap: 12px; align-content: start; padding: 20px; background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow-card); }
.prompt h3 { font: 600 16px/1.35 var(--font-display); letter-spacing: -0.01em; }
.prompt blockquote { margin: 0; padding: 2px 0 2px 14px; border-left: 2px solid var(--soft); font-size: 15px; line-height: 1.55; }
.prompt .why { font-size: 13px; color: var(--muted); }
.prompt .btn { justify-self: start; }

/* ============================================================ Week */
.week-title { font: var(--display-weight) clamp(24px, 2.4vw, 32px)/1.15 var(--font-display); letter-spacing: var(--display-track); margin-top: 8px; }
.week-stats { display: flex; flex-wrap: wrap; gap: 24px 48px; margin: 32px 0; }
.weekline { margin: 8px 0 32px; max-width: 520px; }
.weekline svg { display: block; width: 100%; height: 40px; overflow: visible; }
.weekline .lbl { font: 500 10px var(--font-mono); letter-spacing: .08em; fill: var(--muted); }
.weekline .today-dot { transform-box: fill-box; transform-origin: center; animation: breathe 5.2s var(--ease-breathe) infinite alternate; }
@keyframes breathe { from { opacity: .4; transform: scale(.74); } to { opacity: 1; transform: scale(1.12); } }
.summary { font-size: 17px; line-height: 1.6; max-width: 64ch; }
.pathline { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 24px; font-size: 14px; color: var(--muted); }

/* ============================================================ Footer */
.foot { margin-top: 64px; padding-top: 16px; border-top: 1px solid var(--border); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; }
.foot p { font-size: 13px; color: var(--muted); }

/* ============================================================ Settings popover */
.pop-wrap { position: relative; }
.pop {
  position: absolute; right: 0; top: calc(100% + 8px); z-index: 30; width: 340px; padding: 16px; display: grid; gap: 16px;
  background: var(--raised); border-radius: var(--r-window); box-shadow: var(--shadow-lift);
  transform-origin: top right; animation: pop-in 220ms var(--ease) both;
}
:root[data-style="morning-light"] .pop { border-radius: 22px; }
@keyframes pop-in { from { opacity: 0; transform: translateY(-4px) scale(.98); } to { opacity: 1; transform: none; } }
.pop .seg { display: flex; }
.pop .seg button { flex: 1; justify-content: center; padding: 0 8px; font-size: 13px; }
.swatches { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.swatch { display: grid; gap: 6px; padding: 10px; border: 0; border-radius: var(--r-control); background: var(--surface); box-shadow: inset 0 0 0 1px var(--border); text-align: left; font-size: 13px; font-weight: 500; transition: box-shadow 200ms var(--ease), transform 100ms var(--ease); }
:root[data-style="morning-light"] .swatch { border-radius: 12px; }
.swatch:active { transform: scale(.97); }
.swatch[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--accent); }
.swatch .bars { display: flex; gap: 3px; }
.swatch .bars i { height: 10px; flex: 1; border-radius: 3px; }
.pop .hint { font-size: 12.5px; color: var(--muted); }

/* ============================================================ Dialogs */
dialog {
  width: min(640px, calc(100vw - 32px)); max-height: min(86vh, 900px); padding: 0; border: 0; overflow: auto;
  border-radius: var(--r-window); background: var(--surface); color: var(--ink); box-shadow: var(--shadow-lift);
}
dialog[open] { animation: dlg-in 320ms var(--ease) both; }
dialog.is-closing { animation: dlg-out 180ms var(--ease-fade) both; }
dialog::backdrop { background: rgba(var(--shadow-rgb, 18, 48, 73), .32); }
@keyframes dlg-in { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes dlg-out { to { opacity: 0; transform: translateY(4px) scale(.99); } }
.dlg { padding: 24px; display: grid; gap: 20px; }
.dlg:focus { outline: none; }
.dlg-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.dlg-top .chips { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.icon-btn { display: inline-grid; place-items: center; width: 40px; height: 40px; border: 0; border-radius: var(--r-control); background: transparent; color: var(--muted); transition: background-color 200ms var(--ease), transform 100ms var(--ease); }
.icon-btn:hover { background: var(--hover); color: var(--ink); }
.icon-btn:active { transform: scale(.97); }
.title-input { width: 100%; border: 0; padding: 4px 0; background: transparent; font: var(--display-weight) 24px/1.25 var(--font-display); letter-spacing: var(--display-track); resize: none; field-sizing: content; outline: none; border-bottom: 1px solid transparent; }
.title-input:focus { border-bottom-color: var(--accent); }
.why-line { font-size: 14px; color: var(--muted); }
.why-line b { color: var(--ink); font-weight: 600; }
.detail-text { font-size: 15px; line-height: 1.6; }
.callout { display: flex; gap: 10px; padding: 12px 14px; border-radius: var(--r-control); background: var(--warn-tint); color: var(--ink); font-size: 14px; }
:root[data-style="morning-light"] .callout { border-radius: 12px; }
.callout .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn-dot); flex: none; margin-top: 6px; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.field { display: grid; gap: 6px; }
.field.full { grid-column: 1 / -1; }
.input {
  width: 100%; min-height: 40px; padding: 8px 12px; border: 0; border-radius: var(--r-control); background: var(--surface);
  box-shadow: inset 0 0 0 1px var(--line-strong); font-size: 15px; transition: box-shadow 200ms var(--ease);
}
:root[data-style="morning-light"] .input { border-radius: 12px; }
.input:focus { outline: none; box-shadow: inset 0 0 0 2px var(--accent); }
select.input { appearance: none; padding-right: 32px; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 17px) 18px, calc(100% - 12px) 18px; background-size: 5px 5px; background-repeat: no-repeat; }
.move { display: flex; flex-wrap: wrap; }
.move button { flex: 1 1 auto; justify-content: center; font-size: 13px; padding: 0 10px; }
.checklist { display: grid; gap: 2px; }
.ck { display: flex; align-items: center; gap: 10px; min-height: 40px; font-size: 14px; }
.ck input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
.ck.done span { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--soft); }
.dlg-links { display: flex; flex-wrap: wrap; gap: 8px; }
.dlg-foot { display: flex; justify-content: space-between; gap: 8px; padding-top: 16px; border-top: 1px solid var(--border); }

/* ============================================================ Toast */
.toast {
  position: fixed; left: 50%; bottom: 24px; z-index: 60; display: flex; align-items: center; gap: 12px; max-width: calc(100vw - 32px);

  transform: translate(-50%, 0); animation: toast-in 360ms var(--ease) both;
}
.toast.is-out { animation: toast-out 180ms var(--ease-fade) both; }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 6px) scale(.98); } to { opacity: 1; transform: translate(-50%, 0); } }
@keyframes toast-out { to { opacity: 0; transform: translate(-50%, 4px); } }
.toast .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toast .btn { min-height: 32px; padding: 0 12px; border-radius: 999px; }

/* ============================================================ Responsive */
@media (max-width: 1100px) {
  .cols { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 32px 0; }
  .cols > section { border-left: 0; padding: 0 12px 0 0; min-height: 0; }
}
@media (max-width: 860px) {
  .hero-row { grid-template-columns: 1fr; gap: 24px; }

  .sources { justify-content: flex-start; }
}
@media (max-width: 640px) {
  .app { padding: 16px 16px 48px; }
  .hero { padding: 16px 0 24px; }
  .stats { gap: 24px; }
  .stat .n { font-size: 36px; }
  .bar { gap: 12px; padding-bottom: 16px; margin-bottom: 16px; }
  .tabs { width: 100%; }
  .tabs button { flex: 1; justify-content: center; padding: 0 6px; }
  .bar-actions { width: 100%; }
  .bar-actions .btn { flex: 1; }
  .desk { grid-template-columns: minmax(0, 1fr); }
  .day > section { padding-left: 28px; }
  .fields { grid-template-columns: 1fr; }
  .lrow { grid-template-columns: 60px minmax(0, 1fr); }
  .lrow > .chip { grid-column: 2; justify-self: start; }
  .lrow > :nth-child(3) { grid-column: 2; justify-self: start; }
  .letter-actions .btn { flex: 1 1 calc(50% - 8px); }
  .letter-actions .btn:last-child { margin-left: 0; }
  .pop { position: fixed; left: 16px; right: 16px; top: 64px; width: auto; }
  .prompts { grid-template-columns: minmax(0, 1fr); }
  .dlg { padding: 20px 16px; }
}

/* Reduced motion zeros durations AND delays, or staggered entrances hold cards invisible. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; transition-delay: 0ms !important; }
}
</style>

      return LINK_HOSTS.indexOf(x.hostname.toLowerCase()) >= 0 ? x.href : "";
    } catch (e) { return ""; }
  }
  function values(obj) { return Object.keys(obj).map(function (k) { return obj[k]; }); }
  function config() { return state.meta.config || {}; }
  function firstName() {
    var c = config();
    if (c.first_name) return c.first_name;
    if (filled(OWNER_TOKEN)) return OWNER_TOKEN;
    return "";
  }
  function areas() {
    var a = (config().areas && config().areas.length) ? config().areas : TOKEN_AREAS;
    return Array.isArray(a) ? a.filter(Boolean) : [];
  }

  /* ------------------------------------------------------------------
     Card logic. Urgency decides the "now" card and every sort; status
     decides the one chip a card shows.
     ------------------------------------------------------------------ */
  function isOpen(c) { return !c.deleted && c.column !== "done"; }
  function isActive(c) { return isOpen(c) && c.column !== "waiting_on"; }
  function rank(c) {
    var du = daysUntil(c.due_date);
    if (du !== null && du < 0) return 0;
    if (du === 0) return 1;
    if (c.flagged) return 2;
    if (c.suspicious) return 3;
    if (c.priority === "high") return 4;
    if (du !== null && du <= 2) return 5;
    if (c.column === "this_week") return 6;
    if (c.column === "inbox") return 7;
    return 8;
  }
  function byUrgency(a, b) {
    return rank(a) - rank(b) || (a.due_date || "9999").localeCompare(b.due_date || "9999") || (a.added_date || "").localeCompare(b.added_date || "");
  }
  function openCards() { return values(state.todos).filter(isOpen).sort(byUrgency); }
  function topThree() { return openCards().filter(function (c) { return isActive(c) && !c.suspicious && c.column !== "later"; }).slice(0, 3); }
  function nowId() { var t = topThree(); return t.length ? t[0].id : null; }
  function waitDays(c) { return daysSince(c.waiting_since || c.added_date); }
  function isStale(c) { return isActive(c) && !c.long_term && daysSince(c.added_date) >= STALE_DAYS; }

  function statusChip(c) {
    if (c.column === "done") return '<span class="chip chip-ok"><span class="t">Done ' + esc(shortDate(c.done_date)) + "</span></span>";
    if (c.suspicious) return '<span class="chip chip-warn"><span class="dot"></span><span class="t">Review</span></span>';
    if (c.flagged && c.flag_reason) return '<span class="chip chip-warn"><span class="dot"></span><span class="t">' + esc(c.flag_reason.length > 22 ? "Check" : c.flag_reason) + "</span></span>";
    var du = daysUntil(c.due_date);
    if (c.column === "waiting_on") {
      var w = waitDays(c);
      return '<span class="chip' + (w > WAITING_NUDGE_DAYS ? " chip-warn" : "") + '">' + (w > WAITING_NUDGE_DAYS ? '<span class="dot"></span>' : "") + '<span class="t">Waiting ' + w + "d</span></span>";
    }
    if (du !== null && du < 0) return '<span class="chip chip-warn"><span class="dot"></span><span class="t">Overdue ' + (-du) + "d</span></span>";
    if (du === 0) return '<span class="chip chip-accent"><span class="dot"></span><span class="t">Due today</span></span>';
    if (isStale(c)) return '<span class="chip chip-warn"><span class="dot"></span><span class="t">Stale ' + daysSince(c.added_date) + "d</span></span>";
    return "";
  }
  function dueText(c) {
    if (c.column === "done") return "";
    var du = daysUntil(c.due_date);
    var bits = [];
    if (c.checklist && c.checklist.length) bits.push(c.checklist.filter(function (x) { return x.done; }).length + "/" + c.checklist.length);
    if (du === 1) bits.push("TMRW");
    else if (du !== null && du > 1) bits.push(shortDate(c.due_date).toUpperCase());
    return bits.join(" · ");
  }
  function sourceChip(c, extraCls) {
    var s = SOURCES[c.source_type] || SOURCES.manual;
    var when = shortDate(c.added_date);
    var tip = (c.source_label || s.name) + (when ? " · " + when : "");
    var link = safeLink(c.source_link);
    var inner = icon(c.source_type in GLYPH ? c.source_type : "manual", "icon-sm") + '<span class="t">' + esc(s.chip + (when ? " · " + when : "")) + "</span>";
    var cls = "chip src" + (extraCls ? " " + extraCls : "");
    if (link) return '<a class="' + cls + '" href="' + esc(link) + '" target="_blank" rel="noopener" data-tip="' + esc(tip) + '" aria-label="' + esc(s.open + ": " + tip) + '">' + inner + "</a>";
    return '<span class="' + cls + '" data-tip="' + esc(tip) + '">' + inner + "</span>";
  }
  function ctxLine(c) {
    if (c.column === "waiting_on" && c.waiting_on) return "Waiting on " + c.waiting_on;
    return c.source_label || c.project || "";
  }

  var renderIndex = 0;
  function cardHtml(c, opts) {
    opts = opts || {};
    var isNew = ui.seen && !ui.seen[c.id];
    var cls = "card" + (c.column === "done" ? " is-done" : "") + (c.id === opts.now ? " is-now" : "") + (isNew ? " is-new" : "");
    var attrs = ' data-id="' + esc(c.id) + '" tabindex="0" role="button" aria-label="' + esc(c.title) + '"' +
      (c.confidence === "medium" ? ' data-conf="medium"' : "") + (c.suspicious ? " data-sus" : "") +
      (opts.drag ? ' draggable="true"' : "") + (isNew ? ' style="--i:' + Math.min(renderIndex++, 12) + '"' : "");
    var due = dueText(c);
    return '<article class="' + cls + '"' + attrs + ">" +
      '<button class="check" data-action="toggle" data-id="' + esc(c.id) + '" aria-label="' + (c.column === "done" ? "Mark not done: " : "Mark done: ") + esc(c.title) + '">' +
      '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></button>' +
      '<div class="card-main"><h3 class="card-title"><span>' + esc(c.title) + "</span></h3>" +
      (ctxLine(c) ? '<p class="card-ctx">' + esc(ctxLine(c)) + "</p>" : "") +
      '<div class="card-foot">' + sourceChip(c) + statusChip(c) + (due ? '<span class="due">' + esc(due) + "</span>" : "") + "</div></div></article>";
  }
  function emptyLine(text) {
    return '<div class="empty"><canvas class="orb" data-orb="working" data-paused="1" aria-hidden="true"></canvas><span class="eyebrow">' + esc(text) + "</span></div>";
  }

  /* ------------------------------------------------------------------ Header */
  function greetingWord() {
    var h = new Date().getHours();
    if (h < 5) return "Working late";
    if (h < 12) return "Good morning";
    if (h < 17) return "Good afternoon";
    return "Good evening";
  }
  function counts() {
    var all = values(state.todos);
    var active = all.filter(function (c) { return isActive(c) && !c.suspicious; });
    return {
      owed: active.length,
      waiting: all.filter(function (c) { return isOpen(c) && c.column === "waiting_on"; }).length,
      due: active.filter(function (c) { var d = daysUntil(c.due_date); return d !== null && d <= 0; }).length
    };
  }
  function sweepRunning() {
    var s = state.meta.sweep || {};
    if (!s.sweep_started_at) return false;
    var started = Date.parse(s.sweep_started_at), last = Date.parse(s.last_sweep_at || 0) || 0;
    // A sweep that started over an hour ago and never finished is not "running"; it failed.
    return started > last && Date.now() - started < 3600000;
  }
  function renderHeader() {
    var now = new Date();
    document.getElementById("dateline").textContent = DAY[now.getDay()] + " · " + MON[now.getMonth()] + " " + now.getDate();
    var name = firstName();
    document.getElementById("greeting").textContent = greetingWord() + (name ? ", " + name : "") + ".";
    var brief = state.meta.brief || {};
    var k = counts();
    var focus = state.unavailable ? "Your board can't reach its data from here." : brief.focus || (state.loaded && !k.owed ? "Nothing needs you right now. The next sweep runs at " + nextSweep() + "." : "");
    document.getElementById("focus").textContent = focus;

    document.getElementById("stats").innerHTML = [
      [k.owed, "You owe"], [k.waiting, "Waiting on"], [k.due, "Due today"]
    ].map(function (s) { return '<div class="stat"><span class="n">' + s[0] + '</span><span class="eyebrow">' + s[1] + "</span></div>"; }).join("");

    var sweep = state.meta.sweep || {}, brain = state.meta.brain || {};
    var lines = [];
    if (sweepRunning()) {
      var names = (config().sources || []).map(function (id) { return (SOURCES[id] || {}).name; }).filter(Boolean).slice(0, 3);
      lines.push('<span class="sweeping"><canvas class="orb live" data-orb="working" aria-hidden="true"></canvas><span class="eyebrow">Sweeping' + (names.length ? " · " + esc(names.join(" · ")) : "") + "</span></span>");
    }
    if (sweep.last_sweep_at) {
      var variant = sweep.last_variant === "friday" ? "Friday recap" : (sweep.last_variant || "morning") + " librarian";
      lines.push("<p>Updated " + esc(whenLabel(sweep.last_sweep_at)) + " by your " + esc(variant) + "</p>");
    } else if (state.loaded) {
      lines.push("<p>Your first sweep runs at " + esc(nextSweep()) + "</p>");
    }
    if (brain.updated) lines.push("<p>Notes current as of " + esc(shortDate(brain.updated)) + "</p>");
    var srcs = (config().sources || []).filter(function (id) { return SOURCES[id]; });
    if (srcs.length) {
      lines.push('<div class="sources"><span class="eyebrow">Reading from</span>' + srcs.map(function (id) {
        return '<span class="chip">' + icon(id, "icon-sm") + '<span class="t">' + esc(SOURCES[id].name) + "</span></span>";
      }).join("") + "</div>");
    }
    document.getElementById("fresh").innerHTML = lines.join("");
  }

  /* ------------------------------------------------------------------ Tabs and toolbar */
  function liveDrafts() { return values(state.drafts).filter(function (d) { return d.status !== "dismissed"; }); }
  function renderTabs() {
    var pending = liveDrafts().filter(function (d) { return d.status !== "sent"; }).length;
    var tabs = [["today", "Today", ""], ["drafts", "Drafts", pending || ""], ["prompts", "Prompts", ""], ["week", "Week", ""]];
    document.getElementById("tabs").innerHTML = tabs.map(function (t) {
      return '<button role="tab" data-action="tab" data-tab="' + t[0] + '" aria-selected="' + (ui.tab === t[0]) + '">' + t[1] +
        (t[2] !== "" ? '<span class="count">' + t[2] + "</span>" : "") + "</button>";
    }).join("");
    document.getElementById("barActions").innerHTML = ui.tab === "today"
      ? '<button class="btn" data-action="add" data-mode="call">' + icon("phone") + "Log a call</button>" +
        '<button class="btn btn-primary" data-action="add" data-mode="task">' + icon("plus") + "Add</button>"
      : "";
  }

  /* ------------------------------------------------------------------ Today: four layouts */
  function layout() { return document.documentElement.getAttribute("data-layout") || "desk"; }

  function nudgeHtml() {
    var all = openCards();
    var waits = all.filter(function (c) { return c.column === "waiting_on" && waitDays(c) > WAITING_NUDGE_DAYS; });
    var stale = all.filter(isStale);
    var parts = [];
    if (waits.length) parts.push((waits.length === 1 ? "One wait is" : waits.length + " waits are") + " over a week old: " +
      waits.slice(0, 2).map(function (c) { return '<button data-action="open" data-id="' + esc(c.id) + '">' + esc(c.waiting_on || c.title) + "</button> (" + waitDays(c) + " days)"; }).join(", ") + ". Worth a nudge.");
    if (stale.length) parts.push((stale.length === 1 ? "One card has" : stale.length + " cards have") + " sat for two weeks: " +
      stale.slice(0, 2).map(function (c) { return '<button data-action="open" data-id="' + esc(c.id) + '">' + esc(c.title) + "</button>"; }).join(", ") + ". Keep, move to Later, or let go.");
    return parts.length ? '<p class="nudge"><span class="dot"></span><span>' + parts.join(" ") + "</span></p>" : "";
  }

  function sectionHead(title, count, extra) {
    return '<div class="section-head"><h2>' + esc(title) + '</h2><span class="eyebrow num">' + (extra ? esc(extra) + " · " : "") + count + "</span></div>";
  }

  function renderDesk(now) {
    // Suspicious cards lead the desk in their own group: grouped by area they could land below the fold,
    // and they are the one card the owner must see before acting on anything else.
    var review = openCards().filter(function (c) { return c.suspicious; });
    var cards = openCards().filter(function (c) { return !c.suspicious; });
    var names = areas().slice();
    cards.forEach(function (c) { if (c.area && names.indexOf(c.area) < 0) names.push(c.area); });
    var groups = names.map(function (a) { return { name: a, cards: cards.filter(function (c) { return c.area === a; }) }; });
    var other = cards.filter(function (c) { return !c.area || names.indexOf(c.area) < 0; });
    if (other.length) groups.push({ name: "Other", cards: other, other: true });
    if (review.length) groups.unshift({ name: "Review first", cards: review, other: true });
    if (!groups.length) groups.push({ name: "Today", cards: [] });
    return '<div class="desk">' + groups.map(function (g) {
      return '<section data-drop-area="' + esc(g.other ? "" : g.name) + '">' + sectionHead(g.name, g.cards.length) +
        '<div class="stack">' + (g.cards.length ? g.cards.map(function (c) { return cardHtml(c, { now: now, drag: true }); }).join("") : emptyLine("Clear · next sweep " + nextSweep())) + "</div></section>";
    }).join("") + "</div>";
  }

  function renderColumns(now) {
    var all = values(state.todos).filter(function (c) { return !c.deleted; });
    var EMPTY = { inbox: "Inbox clear", this_week: "Nothing set for this week", waiting_on: "Not waiting on anyone", later: "Nothing parked", done: "Nothing closed yet this week" };
    return '<div class="cols">' + COLUMNS.map(function (col) {
      var list = all.filter(function (c) { return c.column === col.key; });
      if (col.key === "done") list = list.filter(function (c) { return daysSince(c.done_date) <= 7; }).sort(function (a, b) { return (b.done_date || "").localeCompare(a.done_date || ""); });
      else list.sort(byUrgency);
      return '<section data-drop-col="' + col.key + '">' + sectionHead(col.label, list.length) + '<div class="stack">' +
        (list.length ? list.map(function (c) { return cardHtml(c, { now: now, drag: true }); }).join("") : emptyLine(EMPTY[col.key])) + "</div></section>";
    }).join("") + "</div>";
  }

  function renderDay(now) {
    var cards = openCards();
    var today = [], week = [], waiting = [], later = [];
    cards.forEach(function (c) {
      var du = daysUntil(c.due_date);
      if (c.column === "waiting_on") waiting.push(c);
      else if ((du !== null && du <= 0) || c.suspicious || c.id === now) today.push(c);
      else if (c.column === "later" && (du === null || du > 7)) later.push(c);
      else week.push(c);
    });
    var groups = [
      ["Today", today, "Nothing due today · next sweep " + nextSweep()],
      ["This week", week, "Nothing else this week"],
      ["Waiting on", waiting, "Not waiting on anyone"],
      ["Later", later, "Nothing parked"]
    ];
    return '<div class="day">' + groups.map(function (g) {
      return '<section><span class="node" aria-hidden="true"></span>' + sectionHead(g[0], g[1].length) + '<div class="stack">' +
        (g[1].length ? g[1].map(function (c) { return cardHtml(c, { now: now }); }).join("") : emptyLine(g[2])) + "</div></section>";
    }).join("") + "</div>";
  }

  function renderList(now) {
    var top = topThree();
    var topIds = top.map(function (c) { return c.id; });
    var rest = openCards().filter(function (c) { return topIds.indexOf(c.id) < 0 && c.column !== "waiting_on"; });
    var waiting = openCards().filter(function (c) { return c.column === "waiting_on"; });
    return '<div class="list">' +
      '<section>' + sectionHead("Start here", top.length) + '<div class="top3">' +
      (top.length ? top.map(function (c, i) { return '<div class="rankrow"><span class="rank" aria-hidden="true">' + (i + 1) + "</span>" + cardHtml(c, { now: now }) + "</div>"; }).join("") : emptyLine("Nothing pressing · next sweep " + nextSweep())) +
      "</div></section>" +
      (rest.length ? "<section>" + sectionHead("Everything else", rest.length) + '<div class="stack">' + rest.map(function (c) { return cardHtml(c, {}); }).join("") + "</div></section>" : "") +
      (waiting.length ? "<section>" + sectionHead("Waiting on", waiting.length) + '<div class="stack">' + waiting.map(function (c) { return cardHtml(c, {}); }).join("") + "</div></section>" : "") +
      "</div>";
  }

  function extrasHtml() {
    var all = values(state.todos);
    var done = all.filter(function (c) { return !c.deleted && c.column === "done" && daysSince(c.done_date) <= 7; })
      .sort(function (a, b) { return (b.done_date || "").localeCompare(a.done_date || ""); });
    var deleted = all.filter(function (c) { return c.deleted && daysSince(c.deleted_date) <= DELETED_DAYS; });
    var html = "";
    if (layout() !== "columns" && done.length) {
      html += '<details class="fold"><summary>' + icon("chevron") + '<span class="eyebrow num">Done this week · ' + done.length + '</span></summary><div class="rows">' +
        done.map(function (c) { return '<div class="row"><span class="grow">' + esc(c.title) + '</span><span class="eyebrow">' + esc(shortDate(c.done_date)) + '</span><button class="btn btn-quiet" data-action="toggle" data-id="' + esc(c.id) + '">Reopen</button></div>'; }).join("") + "</div></details>";
    }
    if (deleted.length) {
      html += '<details class="fold"><summary>' + icon("chevron") + '<span class="eyebrow num">Recently deleted · ' + deleted.length + '</span></summary><div class="rows">' +
        deleted.map(function (c) { return '<div class="row"><span class="grow muted">' + esc(c.title) + '</span><button class="btn btn-quiet" data-action="restore" data-id="' + esc(c.id) + '">Restore</button></div>'; }).join("") + "</div></details>";
    }
    return html ? '<div class="extras">' + html + "</div>" : "";
  }

  function renderToday() {
    var now = nowId();
    renderIndex = 0;
    var anything = values(state.todos).some(function (c) { return !c.deleted; });
    if (state.unavailable) {
      return '<div class="empty empty-hero"><canvas class="orb" data-orb="working" data-size="64" data-paused="1" aria-hidden="true"></canvas>' +
        '<span class="eyebrow">Live data unavailable · open your HQ from the Artifacts list in Claude</span></div>';
    }
    if (state.loaded && !anything) {
      return '<div class="empty empty-hero"><canvas class="orb" data-orb="working" data-size="64" data-paused="1" aria-hidden="true"></canvas>' +
        '<span class="eyebrow">Nothing on your plate yet · first sweep ' + esc(nextSweep()) + "</span></div>" + extrasHtml();
    }
    var body = { desk: renderDesk, columns: renderColumns, day: renderDay, list: renderList }[layout()] || renderDesk;
    return nudgeHtml() + body(now) + extrasHtml();
  }

  /* ------------------------------------------------------------------ Drafts */
  var COMPOSE_LIMIT = 1800; // Long compose URLs fail in some browsers and Outlook builds (consult section 4).
  // An edit to an empty body is still the owner's edit: never fall back to the text they removed.
  function draftText(d) { return d.body_edited != null ? d.body_edited : (d.body || ""); }
  function recipients(list) { return (list || []).map(function (r) { return r.address || r.name; }).filter(Boolean); }
  // Outlook on the web compose deeplink. It opens a NEW message: the thread is not quoted, so
  // the page also offers "Open original" for a threaded reply. Multiple recipients use ";".
  function composeUrl(d) {
    // Commas separate recipients; cc is left out because the deeplink's cc support is unverified (drafting.md).
    return "https://outlook.office.com/mail/deeplink/compose?to=" + encodeURIComponent(recipients(d.to).join(",")) +
      "&subject=" + encodeURIComponent(d.subject || "") + "&body=" + encodeURIComponent(draftText(d));
  }
  function draftStatus(d) {
    if (d.status === "sent") return '<span class="chip chip-ok"><span class="t">Sent ' + esc(shortDate(d.sent_at)) + "</span></span>";
    if (d.status === "stale") return '<span class="chip chip-warn"><span class="dot"></span><span class="t">Out of date</span></span>';
    if (d.status === "edited") return '<span class="chip"><span class="t">Edited</span></span>';
    return '<span class="chip"><span class="t">Ready</span></span>';
  }
  function letterHtml(d) {
    var to = (d.to || []).map(function (r) { return esc(r.name || r.address) + (r.name && r.address ? ' <span class="addr">' + esc(r.address) + "</span>" : ""); }).join(", ");
    var url = composeUrl(d);
    var tooLong = url.length > COMPOSE_LIMIT;
    var thread = safeLink(d.thread_link);
    var whyBits = [];
    if (d.why) whyBits.push("Why: " + esc(d.why));
    whyBits.push(d.confidence === "medium" ? "Medium confidence, give it a read" : "High confidence");
    if (d.assumptions && d.assumptions.length) whyBits.push("Assumes " + esc(d.assumptions.join("; ")));
    if (d.status === "stale" && d.stale_reason) whyBits.unshift("Out of date: " + esc(d.stale_reason));
    var isNew = ui.seen && !ui.seen["d:" + d.id];
    return '<article class="letter' + (d.status === "stale" ? " is-stale" : "") + (isNew ? " is-new" : "") + '" id="draft-' + esc(d.id) + '" data-draft="' + esc(d.id) + '"' + (isNew ? ' style="--i:' + Math.min(renderIndex++, 6) + '"' : "") + ">" +
      '<div class="letter-head">' +
      '<div class="lrow"><span class="eyebrow">To</span><span>' + (to || '<span class="addr">Needs a recipient</span>') + "</span>" + draftStatus(d) + "</div>" +
      (d.cc && d.cc.length ? '<div class="lrow"><span class="eyebrow">Cc</span><span>' + d.cc.map(function (r) { return esc(r.name || r.address); }).join(", ") + "</span></div>" : "") +
      '<div class="lrow"><span class="eyebrow">Subject</span><span class="subj">' + esc(d.subject) + "</span></div></div>" +
      '<label class="sr" for="body-' + esc(d.id) + '">Draft to ' + esc(recipients(d.to).join(", ")) + "</label>" +
      '<textarea class="letter-body" id="body-' + esc(d.id) + '" data-draft-body="' + esc(d.id) + '" spellcheck="true"' + (d.status === "sent" ? " readonly" : "") + ">" + esc(draftText(d)) + "</textarea>" +
      '<p class="letter-why">' + whyBits.join(" · ") + "</p>" +
      '<div class="letter-actions">' +
      '<button class="btn btn-primary" data-action="copy-draft" data-id="' + esc(d.id) + '">' + icon("copy") + "Copy</button>" +
      (thread ? '<a class="btn" href="' + esc(thread) + '" target="_blank" rel="noopener">Open original' + icon("external", "icon arrow") + "</a>"
        : '<span class="btn" aria-disabled="true">No link to the original</span>') +
      (tooLong ? '<span class="btn" aria-disabled="true">Long draft: copy instead</span>'
        : '<a class="btn" data-compose="' + esc(d.id) + '" href="' + esc(url) + '" target="_blank" rel="noopener">New email in Outlook' + icon("external", "icon arrow") + "</a>") +
      '<button class="btn btn-quiet" data-action="dismiss-draft" data-id="' + esc(d.id) + '">Dismiss</button>' +
      "</div></article>";
  }
  function renderDrafts() {
    var order = { ready: 0, edited: 0, stale: 1, sent: 2 };
    var list = liveDrafts().sort(function (a, b) { return (order[a.status] || 0) - (order[b.status] || 0) || (b.created_at || "").localeCompare(a.created_at || ""); });
    renderIndex = 0;
    var voice = config().voice_profile_path;
    var html = '<div class="narrow"><p class="help">For a threaded reply, open the original, hit Reply, and paste. Nothing here is ever sent for you.</p>';
    if (!voice) html += '<div class="voice-nudge">' + icon("sparkle") + "<span>Say “learn my voice” to make these sound like you.</span></div>";
    else html += '<div style="height:16px"></div>';
    html += list.length ? '<div class="letters">' + list.map(letterHtml).join("") + "</div>" : emptyLine("No drafts waiting · next sweep " + nextSweep());
    return html + "</div>";
  }

  /* ------------------------------------------------------------------ Prompts */
  function renderPrompts() {
    var list = values(state.prompts).sort(function (a, b) { return (a.title || "").localeCompare(b.title || ""); });
    if (!list.length) return emptyLine("Prompts arrive with your Friday recap");
    return '<p class="help">Copy one into Claude when you want it. No typing needed.</p><div style="height:16px"></div><div class="prompts">' + list.map(function (p) {
      return '<article class="prompt">' + (p.area ? '<span class="eyebrow">' + esc(p.area) + "</span>" : "") +
        "<h3>" + esc(p.title) + "</h3><blockquote>" + esc(p.prompt) + "</blockquote>" +

        '<button class="btn" data-action="copy-prompt" data-id="' + esc(p.id) + '">' + icon("copy") + "Copy</button></article>";
    }).join("") + "</div>";
  }

  /* ------------------------------------------------------------------ Week */
  function weekLine() {
    // The brand's dotted motif: five weekday nodes on a soft dotted line. Today's node breathes;
    // it is the only ambient motion on the board, and reduced motion stills it.
    var start = weekStart(), todayIdx = (new Date().getDay() + 6) % 7, W = 520, labels = ["Mon", "Tue", "Wed", "Thu", "Fri"];
    var x = function (i) { return 28 + i * ((W - 56) / 4); };
    var nodes = labels.map(function (l, i) {
      var past = i < todayIdx, today = i === todayIdx;
      var d = new Date(start); d.setDate(start.getDate() + i);
      var dot = today ? '<circle class="today-dot" cx="' + x(i) + '" cy="12" r="3.2" fill="var(--accent)"/><circle cx="' + x(i) + '" cy="12" r="7" fill="none" stroke="var(--accent)" stroke-opacity=".35" stroke-width="1.2"/>'
        : '<circle cx="' + x(i) + '" cy="12" r="' + (past ? 3 : 2.4) + '" fill="' + (past ? "var(--ink)" : "var(--page)") + '" fill-opacity="' + (past ? ".55" : "1") + '" stroke="' + (past ? "none" : "var(--line-strong)") + '" stroke-width="1.4"/>';
      return dot + '<text class="lbl" x="' + x(i) + '" y="36" text-anchor="middle">' + l.toUpperCase() + " " + d.getDate() + "</text>";
    }).join("");
    return '<div class="weekline" aria-hidden="true"><svg viewBox="0 0 ' + W + ' 40" preserveAspectRatio="none"><line x1="' + x(0) + '" y1="12" x2="' + x(4) + '" y2="12" stroke="var(--soft)" stroke-width="2" stroke-linecap="round" stroke-dasharray="0.1 6"/>' + nodes + "</svg></div>";
  }
  function renderWeek() {
    var w = state.meta.weekly;
    var start = weekStart(), end = new Date(start); end.setDate(start.getDate() + 4);
    var label = "Week " + isoWeek(new Date()) + " · " + shortDate(isoDay(start)) + " to " + shortDate(isoDay(end));
    var html = '<div class="narrow"><span class="eyebrow">' + esc(label) + "</span>" + weekLine();
    if (!w) return html + emptyLine("First recap Friday 4:00 PM") + "</div>";
    html += '<h2 class="week-title">' + esc((w.summary_text || "").split(/(?<=\.)\s/)[0] || "This week.") + "</h2>";
    html += '<div class="week-stats">' + [[w.closed, "Closed"], [w.added, "Added"], [w.drafts_made, "Drafts made"], [w.drafts_sent, "Drafts sent"]].map(function (s) {
      return '<div class="stat"><span class="n">' + (s[0] == null ? "0" : esc(s[0])) + '</span><span class="eyebrow">' + s[1] + "</span></div>";
    }).join("") + "</div>";
    var rest = (w.summary_text || "").split(/(?<=\.)\s/).slice(1).join(" ");
    if (rest) html += '<p class="summary">' + esc(rest) + "</p>";
    if (w.week_file_path) html += '<p class="pathline">Saved to your notes as <span class="chip"><span class="t" style="text-transform:none">' + esc(w.week_file_path) + '</span></span><button class="btn btn-quiet" data-action="copy-path">Copy path</button></p>';
    if (w.brain_write_failed) html += '<p class="nudge" style="margin-top:16px"><span class="dot"></span><span>The recap could not be saved to your notes this week. Say “check my HQ” to retry.</span></p>';
    var done = values(state.todos).filter(function (c) { return !c.deleted && c.column === "done" && parseDay(c.done_date) >= start; });
    if (done.length) html += '<div style="height:32px"></div>' + sectionHead("Closed this week", done.length) + '<div class="rows">' +
      done.map(function (c) { return '<div class="row"><span class="grow">' + esc(c.title) + '</span><span class="eyebrow">' + esc(shortDate(c.done_date)) + "</span></div>"; }).join("") + "</div>";
    return html + "</div>";
  }

  /* ------------------------------------------------------------------ Footer */
  function renderFoot() {
    var s = state.meta.sweep || {};
    var v = config().hq_version || s.hq_version;
    document.getElementById("foot").innerHTML =
      '<span class="eyebrow">' + esc(["HQ " + (v || "draft"), s.last_sweep_at ? "Last sweep " + shortDate(isoDay(new Date(s.last_sweep_at))) + " " + clock(s.last_sweep_at) : "No sweep yet"].join(" · ")) + "</span>" +
      "<p>Want something changed? Tell Claude, or drag a box over it and comment.</p>";
  }

  /* ------------------------------------------------------------------
     Render. The whole view is rebuilt from state; it is small (tens of
     cards), and rebuilding keeps every layout honest. Two guards: never
     rebuild under a focused draft textarea (it would eat typing), and
     only cards not seen before get the entrance cascade.
     ------------------------------------------------------------------ */
  var pendingRender = false;
  function scheduleRender() {
    if (pendingRender) return; pendingRender = true;
    requestAnimationFrame(function () { pendingRender = false; renderAll(); });
  }
  function renderAll() {
    var active = document.activeElement;
    if (active && active.hasAttribute && active.hasAttribute("data-draft-body")) { ui.deferred = true; return; }
    renderHeader(); renderTabs(); renderFoot();
    var view = document.getElementById("view");
    view.innerHTML = { today: renderToday, drafts: renderDrafts, prompts: renderPrompts, week: renderWeek }[ui.tab]();
    if (state.loaded) {
      ui.seen = ui.seen || {};
      values(state.todos).forEach(function (c) { ui.seen[c.id] = 1; });
      values(state.drafts).forEach(function (d) { ui.seen["d:" + d.id] = 1; });
    }
    mountOrbs();
  }
  function mountOrbs() {
    ui.orbs.forEach(function (o) { try { o.destroy(); } catch (e) {} });
    ui.orbs = [];
    if (!window.MZC || !MZC.orb) return;
    document.querySelectorAll("canvas[data-orb]").forEach(function (cv) {
      var paused = cv.hasAttribute("data-paused");
      var o = MZC.orb(cv, cv.getAttribute("data-orb"), { size: cv.getAttribute("data-size") === "64" ? 64 : 20, paused: paused });
      if (!paused) o.start();
      ui.orbs.push(o);
    });
  }

  /* ------------------------------------------------------------------
     Writes. One path for both modes: with the db, write and let the
     snapshot re-render; in demo mode, edit state and re-render.
     ------------------------------------------------------------------ */
  function write(col, id, patch, create) {
    if (state.live) {
      var ref = db.collection(col).doc(id);
      return (create ? ref.set(patch) : ref.update(patch)).catch(function (err) {
        console.error(col + " write failed", err);
        toast(err && err.code === "quota_exceeded" ? "The board is full. Delete a few old cards." : "That did not save. Try again.");
      });
    }
    state[col][id] = Object.assign({}, create ? {} : state[col][id], patch, { id: id });
    scheduleRender();
    return Promise.resolve();
  }

  /* ------------------------------------------------------------------ Toast */
  var toastTimer = null;
  function toast(label, actionText, onAction, ms) {
    var host = document.getElementById("toastHost");
    clearTimeout(toastTimer);
    host.innerHTML = '<div class="toast" role="status"><span class="eyebrow t">' + esc(label) + "</span>" +
      (actionText ? '<button class="btn btn-quiet" data-toast-action>' + esc(actionText) + "</button>" : "") + "</div>";
    var el = host.firstChild;
    if (actionText) el.querySelector("[data-toast-action]").addEventListener("click", function () { hideToast(); onAction(); });
    toastTimer = setTimeout(hideToast, ms || 6000);
  }
  function hideToast() {
    var el = document.querySelector(".toast"); if (!el) return;
    el.classList.add("is-out");
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, REDUCED ? 0 : 180);
  }

  /* ------------------------------------------------------------------
     Done, with motion: check fills and draws (240ms io), the title strike
     wipes left to right (260ms), then the card collapses (200ms) and the
     counts tick. Undo for 6 seconds.
     ------------------------------------------------------------------ */
  function collapse(el, then) {
    if (REDUCED || !el) { then(); return; }
    el.style.height = el.offsetHeight + "px";
    el.classList.add("is-leaving");
    el.offsetHeight; // commit the start height before collapsing
    el.style.height = "0px"; el.style.opacity = "0"; el.style.paddingTop = "0px"; el.style.paddingBottom = "0px"; el.style.marginTop = "-8px";
    setTimeout(then, 210);
  }
  function toggleDone(id, el) {
    var c = state.todos[id]; if (!c) return;
    if (c.column === "done") {
      write("todos", id, { column: c.prev_column && c.prev_column !== "done" ? c.prev_column : "this_week", done_date: null });
      return;
    }
    var prev = c.column;
    var card = el && el.closest(".card");
    var finish = function () {
      write("todos", id, { column: "done", done_date: todayIso(), prev_column: prev, flagged: false });
      toast("Done · " + c.title, "Undo", function () { write("todos", id, { column: prev, done_date: null }); });
    };
    if (!card || REDUCED) { finish(); return; }
    card.classList.add("is-completing");
    setTimeout(function () { collapse(card, finish); }, 460);
  }
  function moveTo(id, col) {
    var c = state.todos[id]; if (!c || c.column === col) return;
    var patch = { column: col };
    if (col === "done") { patch.done_date = todayIso(); patch.prev_column = c.column; }
    if (col === "waiting_on") patch.waiting_since = c.waiting_since || todayIso();
    if (c.column === "done") patch.done_date = null;
    write("todos", id, patch);
  }
  function deleteCard(id) {
    var c = state.todos[id]; if (!c) return;
    write("todos", id, { deleted: true, deleted_date: todayIso() });
    toast("Deleted · " + c.title, "Undo", function () { write("todos", id, { deleted: false, deleted_date: null }); });
  }

  /* ------------------------------------------------------------------ Dialogs */
  function openDialog(dlg) {

  }

    if (!dlg.open) return;

  }
  function areaOptions(selected) {
    var list = areas();
    if (selected && list.indexOf(selected) < 0) list = list.concat([selected]);
    return '<option value="">Other</option>' + list.map(function (a) { return "<option" + (a === selected ? " selected" : "") + ">" + esc(a) + "</option>"; }).join("");
  }

  function openDetail(id) {
    var c = state.todos[id]; if (!c) return;

    var dlg = document.getElementById("detail");
    var s = SOURCES[c.source_type] || SOURCES.manual;
    var link = safeLink(c.source_link);
    var draft = c.draft_id && state.drafts[c.draft_id] && state.drafts[c.draft_id].status !== "dismissed";
    var ck = (c.checklist || []).map(function (x, i) {
      return '<label class="ck' + (x.done ? " done" : "") + '"><input type="checkbox" data-ck="' + i + '"' + (x.done ? " checked" : "") + "><span>" + esc(x.text) + "</span></label>";
    }).join("");
    dlg.innerHTML = '<div class="dlg" tabindex="-1" autofocus>' +

      '<button class="icon-btn" data-action="close" aria-label="Close">' + icon("close") + "</button></div>" +

      "</div>" +
      '<div class="dlg-foot"><button class="btn btn-quiet" data-action="delete" data-id="' + esc(id) + '">Delete</button>' +

  function saveDetailField(el) {

  function openAdd(mode) {

        '<label class="field"><span class="eyebrow">What you owe them</span><input class="input" name="title" required autocomplete="off" placeholder="Send the revised delivery window"></label>'
        : '<label class="field"><span class="eyebrow">What needs doing</span><input class="input" name="title" required autocomplete="off" placeholder="Start with a verb"></label>') +

  /* ------------------------------------------------------------------ Settings */
  function prefs() { try { return JSON.parse(localStorage.getItem("hq.prefs") || "null") || {}; } catch (e) { return {}; } }
  function defaults() {
    var c = config();
    return { layout: c.layout || (filled(LAYOUT_TOKEN) ? LAYOUT_TOKEN : "desk"), style: c.style || (filled(STYLE_TOKEN) ? STYLE_TOKEN : "clearwater") };
  }
  function savePrefs(patch) {
    var d = defaults(), p = Object.assign(prefs(), patch, { base: d.layout + "/" + d.style });
    try { localStorage.setItem("hq.prefs", JSON.stringify(p)); } catch (e) {}
  }
  // Apply the board defaults from meta/config unless this viewer picked something since they last changed.
  function applyView() {
    var d = defaults(), p = prefs(), root = document.documentElement;
    var useLocal = p.base === d.layout + "/" + d.style;
    root.setAttribute("data-layout", useLocal && p.layout ? p.layout : d.layout);
    root.setAttribute("data-style", useLocal && p.style ? p.style : d.style);
  }
  function restyle(fn) {
    var root = document.documentElement;

    setTimeout(function () { root.classList.remove("is-restyling"); mountOrbs(); }, 300);
  }
  function currentTheme() { return document.documentElement.getAttribute("data-theme") || "system"; }
  function renderSettings() {
    var root = document.documentElement, L = root.getAttribute("data-layout"), S = root.getAttribute("data-style"), T = currentTheme();
    document.getElementById("settings").innerHTML =
      '<div class="field"><span class="eyebrow">Layout</span><div class="seg" role="group" aria-label="Layout">' +
      LAYOUTS.map(function (l) { return '<button data-action="set-layout" data-v="' + l.key + '" aria-pressed="' + (L === l.key) + '">' + l.label + "</button>"; }).join("") + "</div></div>" +
      '<div class="field"><span class="eyebrow">Style</span><div class="swatches">' +
      STYLES.map(function (s) {
        return '<button class="swatch" data-action="set-style" data-v="' + s.key + '" aria-pressed="' + (S === s.key) + '"><span class="bars">' +
          s.bars.map(function (b) { return '<i style="background:' + b + '"></i>'; }).join("") + "</span>" + s.label + "</button>";
      }).join("") + "</div></div>" +
      '<div class="field"><span class="eyebrow">Theme</span><div class="seg" role="group" aria-label="Theme">' +
      [["light", "Light"], ["dark", "Dark"], ["system", "System"]].map(function (t) { return '<button data-action="set-theme" data-v="' + t[0] + '" aria-pressed="' + (T === t[0]) + '">' + t[1] + "</button>"; }).join("") + "</div></div>" +

  function toggleSettings(force) {
