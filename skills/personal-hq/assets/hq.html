  }

  /* ------------------------------------------------------------------ Clipboard */
  function copyText(text, label) {
    var done = function () { toast(label || "Copied"); };
    var fallback = function () {
      var ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", "");
      ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
      ok ? done() : toast("Select the text and copy it by hand");
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
  }

  /* ------------------------------------------------------------------ Events (delegated) */
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-action]");
    var pop = document.getElementById("settings");
    if (!pop.hidden && !e.target.closest(".pop-wrap")) toggleSettings(false);
    if (!t) {
      var card = e.target.closest(".card");
      if (card && !e.target.closest("a")) openDetail(card.getAttribute("data-id"));
      return;
    }
    var a = t.getAttribute("data-action"), id = t.getAttribute("data-id");
    switch (a) {
      case "toggle": e.stopPropagation(); toggleDone(id, t); break;
      case "open": openDetail(id); break;
      case "tab": ui.tab = t.getAttribute("data-tab"); renderAll(); break;
      case "add": openAdd(t.getAttribute("data-mode")); break;
      case "close": closeDialog(t.closest("dialog")); break;
      case "move": moveTo(ui.openId, t.getAttribute("data-col")); closeDialog(document.getElementById("detail")); break;
      case "delete": closeDialog(document.getElementById("detail")); deleteCard(id); break;
      case "restore": write("todos", id, { deleted: false, deleted_date: null }); toast("Restored"); break;
      case "goto-draft":
        closeDialog(document.getElementById("detail")); ui.tab = "drafts"; renderAll();
        var el = document.getElementById("draft-" + id); if (el) el.scrollIntoView({ behavior: REDUCED ? "auto" : "smooth", block: "start" });
        break;
      case "copy-draft":
        // Copy what is on screen: an edit is saved on blur, so the snapshot can still hold the old body.
        var d = state.drafts[id], ta = document.querySelector('[data-draft-body="' + id + '"]');
        if (d) copyText(ta ? ta.value : draftText(d), "Draft copied"); break;
      case "dismiss-draft":
        var letter = t.closest(".letter"), prevStatus = (state.drafts[id] || {}).status;
        collapse(letter, function () {
          write("drafts", id, { status: "dismissed" });
          toast("Draft dismissed", "Undo", function () { write("drafts", id, { status: prevStatus || "ready" }); });
        });
        break;
      case "copy-prompt": var p = state.prompts[id]; if (p) copyText(p.prompt, "Prompt copied"); break;
      case "copy-path": copyText((state.meta.weekly || {}).week_file_path || "", "Path copied"); break;
      case "settings": toggleSettings(); break;
      case "set-layout": savePrefs({ layout: t.getAttribute("data-v"), style: document.documentElement.getAttribute("data-style") });
        document.documentElement.setAttribute("data-layout", t.getAttribute("data-v")); ui.tab = "today"; renderAll(); renderSettings(); break;
      case "set-style": var v = t.getAttribute("data-v");
        savePrefs({ style: v, layout: document.documentElement.getAttribute("data-layout") });
        restyle(function () { document.documentElement.setAttribute("data-style", v); }); renderSettings(); break;
      case "set-theme": var th = t.getAttribute("data-v"); savePrefs({ theme: th });
        restyle(function () { if (th === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", th); });
        renderSettings(); break;
    }
  });
  // A compose link must carry the current body, including unsaved edits in the textarea.
  document.addEventListener("pointerdown", function (e) {
    var a = e.target.closest("[data-compose]"); if (!a) return;
    var ta = document.querySelector('[data-draft-body="' + a.getAttribute("data-compose") + '"]');
    var d = state.drafts[a.getAttribute("data-compose")];
    if (ta && d) a.href = composeUrl(Object.assign({}, d, { body_edited: ta.value }));
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { toggleSettings(false); }
    var card = e.target.classList && e.target.classList.contains("card") ? e.target : null;
    if (!card) return;
    var id = card.getAttribute("data-id");
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openDetail(id); }
    else if (e.key === "x" || e.key === "X") { e.preventDefault(); toggleDone(id, card.querySelector(".check")); }
    else if (["ArrowDown", "ArrowUp", "ArrowLeft", "ArrowRight", "j", "k"].indexOf(e.key) >= 0) {
      var all = Array.prototype.slice.call(document.querySelectorAll("#view .card"));
      var i = all.indexOf(card), step = (e.key === "ArrowDown" || e.key === "ArrowRight" || e.key === "j") ? 1 : -1;
      var next = all[i + step]; if (next) { e.preventDefault(); next.focus(); }
    }
  });
  document.addEventListener("focusout", function (e) {
    var el = e.target;
    if (el.hasAttribute && el.hasAttribute("data-draft-body")) {
      var id = el.getAttribute("data-draft-body"), d = state.drafts[id];
      if (d && el.value !== draftText(d)) write("drafts", id, { body_edited: el.value, status: "edited" });
      if (ui.deferred) { ui.deferred = false; setTimeout(renderAll, 0); }
    }
    if (el.hasAttribute && el.hasAttribute("data-field")) saveDetailField(el);
  });
  document.addEventListener("change", function (e) {
    var el = e.target;
    if (el.matches("select[data-field], input[type=date][data-field]")) saveDetailField(el);
    if (el.hasAttribute("data-ck")) {
      var c = state.todos[ui.openId]; if (!c) return;
      var list = (c.checklist || []).map(function (x) { return Object.assign({}, x); });
      list[+el.getAttribute("data-ck")].done = el.checked;
      el.closest(".ck").classList.toggle("done", el.checked);
      write("todos", ui.openId, { checklist: list });
    }
  });
  document.addEventListener("keydown", function (e) {
    var el = e.target;
    if (e.key === "Enter" && el.hasAttribute && el.hasAttribute("data-add-step") && el.value.trim()) {
      e.preventDefault();
      var c = state.todos[ui.openId]; if (!c) return;
      var list = (c.checklist || []).concat([{ text: el.value.trim(), done: false }]);
      // Show the step now; the live snapshot that confirms the write can land after the reopen.
      c.checklist = list; openDetail(ui.openId);
      write("todos", ui.openId, { checklist: list });
    }
    if (e.key === "Enter" && el.classList && el.classList.contains("title-input")) { e.preventDefault(); el.blur(); }
  });
  document.addEventListener("submit", function (e) {
    if (e.target.hasAttribute("data-add-form")) { e.preventDefault(); submitAdd(e.target); }
  });
  document.getElementById("detail").addEventListener("close", function () { ui.openId = null; });

  // Cursor-lit border on the "now" card: write the pointer position on the card itself so
  // style recalculation stays local to it.
  document.addEventListener("pointermove", function (e) {
    var card = e.target.closest && e.target.closest(".card.is-now"); if (!card) return;
    var r = card.getBoundingClientRect();
    card.style.setProperty("--mx", (e.clientX - r.left) + "px"); card.style.setProperty("--my", (e.clientY - r.top) + "px");
  });
  // Tooltips: after the first one shows, the next ones skip the 300ms delay for a moment.
  var warmTimer = null;
  document.addEventListener("pointerover", function (e) {
    if (!e.target.closest || !e.target.closest(".src[data-tip]")) return;
    clearTimeout(warmTimer);
    warmTimer = setTimeout(function () { document.body.classList.add("tips-warm"); }, 320);
  });
  document.addEventListener("pointerout", function (e) {
    if (!e.target.closest || !e.target.closest(".src[data-tip]")) return;
    clearTimeout(warmTimer);
    warmTimer = setTimeout(function () { document.body.classList.remove("tips-warm"); }, 700);
  });

  // Drag a card between columns (columns layout) or between areas (desk layout).
  var dragId = null;
  document.addEventListener("dragstart", function (e) {
    var card = e.target.closest && e.target.closest(".card[draggable]"); if (!card) return;
    dragId = card.getAttribute("data-id");
    e.dataTransfer.effectAllowed = "move";
    try { e.dataTransfer.setData("text/plain", dragId); } catch (err) {}
  });
  document.addEventListener("dragover", function (e) {
    var zone = dragId && e.target.closest("[data-drop-col],[data-drop-area]"); if (!zone) return;
    e.preventDefault();
    document.querySelectorAll(".drop-on").forEach(function (z) { if (z !== zone) z.classList.remove("drop-on"); });
    zone.classList.add("drop-on");
  });
  document.addEventListener("drop", function (e) {
    var zone = dragId && e.target.closest("[data-drop-col],[data-drop-area]"); if (!zone) return;
    e.preventDefault();
    if (zone.hasAttribute("data-drop-col")) moveTo(dragId, zone.getAttribute("data-drop-col"));
    else if ((state.todos[dragId] || {}).area !== (zone.getAttribute("data-drop-area") || undefined)) write("todos", dragId, { area: zone.getAttribute("data-drop-area") || null });
  });
  document.addEventListener("dragend", function () { dragId = null; document.querySelectorAll(".drop-on").forEach(function (z) { z.classList.remove("drop-on"); }); });

  /* ------------------------------------------------------------------
     Boot. claude.use("db") resolves null where db cannot run; a preview
     outside claude.ai has no window.claude at all. Either way, demo data.
     ------------------------------------------------------------------ */
  function subscribe() {
    var firstTodos = true;
    var handleErr = function (what) { return function (err) { console.error(what + " snapshot error", err); }; };
    ["todos", "drafts", "prompts"].forEach(function (col) {
      db.collection(col).onSnapshot(function (snap) {
        var next = {};
        snap.docs.forEach(function (d) { next[d.id] = Object.assign({ id: d.id }, d.data()); });
        state[col] = next;
        if (col === "todos" && firstTodos) { firstTodos = false; state.loaded = true; }
        scheduleRender();
      }, handleErr(col));
    });
    ["config", "sweep", "brief", "brain", "weekly"].forEach(function (key) {
      db.doc("meta/" + key).onSnapshot(function (snap) {
        state.meta[key] = snap.exists ? snap.data() : null;
        if (key === "config") applyView();
        scheduleRender();
      }, handleErr("meta/" + key));
    });
  }
  async function boot() {
    renderAll();
    if (/^#demo/.test(location.hash)) { loadDemo(); return; }
    var api = null;
    try {
      if (window.claude && typeof window.claude.use === "function") {
        api = await Promise.race([window.claude.use("db"), new Promise(function (r) { setTimeout(function () { r(null); }, 5000); })]);
      }
    } catch (e) { api = null; }
    // A filled template is someone's real board: never dress it in Jordan's sample cards.
    if (!api && filled(OWNER_TOKEN)) { state.unavailable = true; state.loaded = true; renderAll(); return; }
    if (!api) { loadDemo(); return; }
    db = api; state.live = true;
    subscribe();
  }
  boot();
  // Greeting and "due today" depend on the clock; refresh them when the tab comes back.
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") scheduleRender(); });
})();
